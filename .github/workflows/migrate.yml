name: Migrate database

# Runs `prisma migrate deploy` against a chosen database, from a GitHub runner
# rather than from someone's laptop.
#
# ## Why this exists
#
# Two reasons, and the second is the one that will matter in six months.
#
# 1. **Supabase's direct host is IPv6-only** on the free tier, and most home and
#    mobile ISPs are IPv4-only — Tanzanian ones included. The session pooler is
#    IPv4-reachable and is the documented way round that, but reaching a
#    database from a home connection stays fragile: filtered ports, long
#    round trips against short client timeouts, captive portals. On
#    2026-08-28 that cost an evening. GitHub's runners have IPv6, no egress
#    filtering, and sit close to eu-west-1.
#
# 2. **A production migration should not depend on one person's laptop being
#    online.** That is true even when the laptop works. This makes the
#    operation reproducible, logged, and available to anyone with repository
#    access.
#
# Manual dispatch only. Nothing here runs on a push — a schema change reaching
# production because someone merged a branch is precisely the accident worth
# designing out.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the project ref to confirm (nnrcjeowivnbzdkwxxrm)'
        required: true
        type: string
      baseline:
        description: 'First run only: mark an existing migration as already applied, e.g. 20260827000000_init_postgres. Leave blank otherwise.'
        required: false
        type: string

concurrency:
  # Two migrations racing the same database is the one thing worse than no
  # migration at all. `cancel-in-progress: false` because a half-applied
  # migration must be allowed to finish rather than be killed mid-statement.
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest

    # There was an `environment: production` here, as somewhere to hang a
    # required-reviewer rule later. It had to go, and the reason is worth
    # recording because the symptom gave nothing away: **environments are a
    # paid feature in private repositories** — GitHub Free offers them on
    # public repos only. A private-repo workflow that names one is not
    # registered at all. Not a red X, not an "invalid workflow file" banner:
    # the workflow simply never appears in the Actions sidebar, and its URL
    # answers "This workflow does not exist." Meanwhile `ci.yml`, which names
    # no environment, ran perfectly from the same commit.
    #
    # If a second pair of eyes on production migrations ever matters more than
    # the plan cost, this is the line to put back — along with GitHub Pro.

    steps:
      # Typing the ref is not security — anyone who can dispatch this can type
      # it. It is a speed bump against the wrong tab and the wrong button,
      # which is the realistic failure mode for a one-click production action.
      - name: Confirm the target
        run: |
          if [ "${{ inputs.confirm }}" != "nnrcjeowivnbzdkwxxrm" ]; then
            echo "::error::Confirmation did not match the project ref. Nothing ran."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs #2 and #3 failed here in a way worth designing out permanently.
      #
      # `prisma.config.ts` only sets `datasource.url` when `DATABASE_URL` is
      # non-empty - it has to, because `npm ci` runs `prisma generate`, which
      # never connects and must not demand a URL. The cost of that is this: with
      # the secret unset or wrong, Prisma falls back to the `url` in
      # `schema.prisma` and every step below quietly aims at `localhost:5432`. A
      # runner has no database, so it fails - but it fails as `P1001 Can't reach
      # database server`, which reads like a network problem with Supabase
      # rather than a missing secret. Worse, `migrate status || true` swallowed
      # the first sighting of it entirely.
      #
      # Measured 2026-08-29: both runs died this way, and the secret turned out
      # to hold the local development string from `.env.example` line 11.
      #
      # So: check before anything else touches a database, and name the actual
      # cause. The secret is only ever compared, never echoed.
      - name: Require a database URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DATABASE_URL repository secret is empty or unset. Prisma would fall back to the schema default (localhost:5432) and report a connection error that looks like a Supabase outage. Set it under Settings -> Secrets and variables -> Actions, named exactly DATABASE_URL, using the session pooler string (port 5432, user postgres.nnrcjeowivnbzdkwxxrm)."
            exit 1
          fi
          case "$DATABASE_URL" in
            *localhost*|*127.0.0.1*)
              echo "::error::DATABASE_URL points at localhost. A GitHub runner has no database of its own, so this would either fail or, worse, succeed against something that is not production."
              exit 1
              ;;
          esac
          echo "DATABASE_URL is set and is not a local address."
      # `migrate status` before anything mutating, so the log records what the
      # database looked like going in. When a migration goes wrong, this is the
      # line you want and cannot reconstruct afterwards.
      - name: Migration status before
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate status || true

      # Only for a database whose tables were created outside Prisma — as this
      # one's were, through the Supabase API, which left no `_prisma_migrations`
      # table behind. Without this, `deploy` refuses with P3005 ("the database
      # schema is not empty") rather than trying to replay DDL over live tables.
      - name: Baseline an already-applied migration
        if: ${{ inputs.baseline != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate resolve --applied "${{ inputs.baseline }}"

      - name: Deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Migration status after
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate status
