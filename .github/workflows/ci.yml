name: CI

# Every check the standing baseline requires, run by a machine instead of by
# hand at the Lead's discretion. Nothing reaches master unreviewed by these.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes the older run's answer irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest

    # The repository, order and partner suites talk to a real database. Since
    # the move to Postgres there is no SQLite file to fall back on, and that is
    # the point rather than a cost: `status.integration` and
    # `submissions.integration` exist to prove that two admin tabs racing the
    # same row produce exactly one winner. SQLite serialises writes at the file
    # level; Postgres uses MVCC with row-level locks. A guard that holds under
    # the first says nothing about the second, and production is the second.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without a health check the job races the container: `npm test` can
        # start before Postgres accepts connections, and the failure then reads
        # as a test bug rather than a startup ordering one.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Each suite creates a uniquely-named schema on this server and drops it
      # afterwards, so no two suites see each other's rows and `public` is never
      # touched. `src/server/db/test-database.ts` explains why a schema and not
      # a database, and `src/server/db/client.ts` explains why `?schema=` needs
      # help from the adapter to take effect at all.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` runs `prisma generate`, so the client types exist before
      # the type-check — without it tsc fails on every Prisma model.
      - run: npm ci

      # `tsc` alone is not enough on a fresh checkout, which is the only kind CI
      # gets. Next generates `LayoutProps`, `PageProps` and the route union into
      # `.next/types/`, and `src/app/layout.tsx` uses `LayoutProps<"/">`. A
      # developer never sees this because their `.next` survives from the last
      # `dev` or `build`; CI has no `.next` at all and fails with
      # "Cannot find name 'LayoutProps'" — a type that is not missing so much as
      # not yet written. Measured 2026-08-29 on CI run #3.
      #
      # `typegen` rather than a full `build`: it writes the same types in about a
      # second and touches no database, so the type-check keeps failing fast
      # instead of waiting on a build it does not need.
      - name: Generate route types
        run: npm run typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    # `next build` runs `generateStaticParams`, which queries the database. With
    # no reachable Postgres the build step fails, which reads as an
    # infrastructure fault rather than the missing-database fault it is — so
    # give it one.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The specs assert on real catalogue content — brand names, branch counts,
      # prices — so an empty database would fail them for the wrong reason. The
      # guard inside `db:seed` waves this through because the host is localhost;
      # see src/server/db/destructive-guard.ts.
      - name: Migrate and seed
        run: npm run db:setup

      # Only chromium: the suite declares a single chromium project, and
      # downloading the other two engines doubles this job for nothing.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # E2E runs against a production build, not `next dev`. Dev compiles each
      # route on first request, which is what made these specs flaky under
      # parallel workers locally.
      - name: Build
        run: npm run build

      - name: Run Playwright specs
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
