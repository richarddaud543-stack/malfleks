name: CI

# Every check the standing baseline requires, run by a machine instead of by
# hand at the Lead's discretion. Nothing reaches master unreviewed by these.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes the older run's answer irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Type-check, lint and the unit suite never touch a database; the repository
  # tests build their own throwaway SQLite file. This exists so nothing falls
  # back to a developer's dev.db path.
  DATABASE_URL: file:./prisma/ci.db

jobs:
  static:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` runs `prisma generate`, so the client types exist before
      # the type-check — without it tsc fails on every Prisma model.
      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only chromium: the suite declares a single chromium project, and
      # downloading the other two engines doubles this job for nothing.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # E2E runs against a production build, not `next dev`. Dev compiles each
      # route on first request, which is what made these specs flaky under
      # parallel workers locally.
      - name: Build
        run: npm run build

      - name: Run Playwright specs
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
